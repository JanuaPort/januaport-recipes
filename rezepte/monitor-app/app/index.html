<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Monitor-App</title>
  <link rel="stylesheet" href="style.css">
  <script type="module" src="app.js"></script>
</head>
<body>
<main>
  <h1>Monitor-App</h1>
  <p>Kuratierten Stand der sichtbaren Use Cases laden.</p>
  <form id="query">
    <label for="ref">Use-Case-Referenz (leer: alle sichtbaren)</label>
    <input id="ref" type="text" autocomplete="off">
    <label for="days">Zeitraum in Tagen</label>
    <input id="days" type="number" min="1" max="90" value="7" required>
    <button id="refresh" type="submit">Stand laden</button>
  </form>
  <p id="status" role="status" aria-live="polite">Noch keine Daten geladen.</p>
  <section id="items" aria-label="Use Cases"></section>
</main>
</body>
</html>
