name: Python-Bibliotheken bauen

on:
  workflow_call:
    inputs:
      ordner:
        description: Relativer Skriptordner im aufrufenden Repository
        required: true
        type: string
      ziel:
        description: linux oder windows (Python 3.12, x86_64)
        default: linux
        type: string
  workflow_dispatch:
    inputs:
      ordner:
        description: Relativer Skriptordner
        default: rezepte/python-bibliotheken-bauen/beispiel
        required: true
        type: string
      ziel:
        description: Zielplattform (Python 3.12, x86_64)
        default: linux
        type: choice
        options: [linux, windows]

permissions:
  contents: read

# Beide Ziele schreiben dieselben Ausgabepfade: auch untereinander serialisieren.
concurrency:
  group: python-bibliotheken-${{ github.repository }}-${{ inputs.ordner }}
  cancel-in-progress: false

env:
  ORDNER: ${{ inputs.ordner }}
  ZIEL: ${{ inputs.ziel }}

jobs:
  bauen:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          path: betreiber
          persist-credentials: false
      # Fester Quellstand, auch wenn der Aufrufer ein anderes Repository ist.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: JanuaPort/januaport-recipes
          ref: 8c73f151ad7b55ee8fe9b064974dc52199cc40af # Build-Rezept 0.1.0; bei Logikänderung aktualisieren
          path: rezept
          persist-credentials: false
      - uses: astral-sh/setup-uv@f0ec1fc3b38f5e7cd731bb6ce540c5af426746bb # v6.1.0
        with:
          version: "0.11.3"
          enable-cache: false
      - name: Bauen und Gegenprobe (gemeinsamer lokaler Einstieg)
        working-directory: betreiber
        shell: bash
        run: |
          python3 ../rezept/rezepte/python-bibliotheken-bauen/bauen.py --workflow-ordner "$ORDNER"
          bash ../rezept/rezepte/python-bibliotheken-bauen/bauen.sh "$ORDNER" "$ZIEL"
          mkdir -p "$RUNNER_TEMP/ausgabe"
          cp -- "$ORDNER/requirements.lock" "$RUNNER_TEMP/ausgabe/"
          cp -R -- "$ORDNER/wheels" "$RUNNER_TEMP/ausgabe/wheels"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: python-wheels
          path: ${{ runner.temp }}/ausgabe/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  pull-request:
    needs: bauen
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    env:
      GITHUB_TOKEN: ${{ github.token }}
      PR_BRANCH: wheels/${{ github.run_id }}-${{ github.run_attempt }}
      BASE_BRANCH: ${{ github.ref_name }}
      GIT_AUTHOR_NAME: github-actions[bot]
      GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
      GIT_COMMITTER_NAME: github-actions[bot]
      GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          path: betreiber
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: JanuaPort/januaport-recipes
          ref: 8c73f151ad7b55ee8fe9b064974dc52199cc40af # Build-Rezept 0.1.0; bei Logikänderung aktualisieren
          path: rezept
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: python-wheels
          path: ${{ runner.temp }}/ausgabe
      - name: Artefakte prüfen und PR-Commit vorbereiten
        id: commit
        working-directory: betreiber
        shell: bash
        run: |
          vorher=$(git rev-parse HEAD)
          bash ../rezept/rezepte/python-bibliotheken-bauen/pr-vorbereiten.sh \
            "$ORDNER" "$RUNNER_TEMP/ausgabe" "$PR_BRANCH" "$ZIEL"
          if [[ "$(git rev-parse HEAD)" != "$vorher" ]]; then
            echo 'geaendert=true' >> "$GITHUB_OUTPUT"
          fi
          bash ../rezept/rezepte/python-bibliotheken-bauen/bauen.sh \
            --bericht "$ORDNER" "$ZIEL" > "$RUNNER_TEMP/pr.md"
      - name: PR-Zweig veröffentlichen und PR öffnen
        if: steps.commit.outputs.geaendert == 'true'
        working-directory: betreiber
        shell: bash
        run: |
          git push origin "HEAD:refs/heads/$PR_BRANCH"
          gh pr create --repo "$GITHUB_REPOSITORY" --base "$BASE_BRANCH" \
            --head "$PR_BRANCH" --title "Python-Bibliotheken aktualisieren ($ZIEL)" \
            --body-file "$RUNNER_TEMP/pr.md"
